<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상품 순위추적기 — 네이버·쿠팡</title>
<style>
  :root {
    --ground: #F5F7F5; --card: #FFFFFF; --ink: #171D19; --sub: #5E6B62;
    --line: #DFE6E0; --accent: #03C75A; --accent-deep: #02893F;
    --accent-soft: #E4F7EC; --warn: #D9482B; --warn-soft: #FBEAE5;
    --console-bg: #10221A; --console-ink: #A8D8BC; --chip-name: #EEF2EF;
    --btn-ink: #FFFFFF;
    --chart-s1: #02893F; --chart-s2: #3B6FD4;
    --shadow: 0 1px 3px rgba(23,29,25,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0E120F; --card: #161C17; --ink: #E6ECE8; --sub: #93A198;
      --line: #28322B; --accent: #0ED268; --accent-deep: #7BE3A8;
      --accent-soft: #12301F; --warn: #F0684A; --warn-soft: #3A1D15;
      --console-bg: #0A1710; --console-ink: #8FCBA6; --chip-name: #1E2620;
      --btn-ink: #08130C;
      --chart-s1: #1E9E56; --chart-s2: #5C85D6;
      --shadow: 0 1px 3px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --ground: #0E120F; --card: #161C17; --ink: #E6ECE8; --sub: #93A198;
    --line: #28322B; --accent: #0ED268; --accent-deep: #7BE3A8;
    --accent-soft: #12301F; --warn: #F0684A; --warn-soft: #3A1D15;
    --console-bg: #0A1710; --console-ink: #8FCBA6; --chip-name: #1E2620;
    --btn-ink: #08130C;
    --chart-s1: #1E9E56; --chart-s2: #5C85D6;
    --shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  :root[data-theme="light"] {
    --ground: #F5F7F5; --card: #FFFFFF; --ink: #171D19; --sub: #5E6B62;
    --line: #DFE6E0; --accent: #03C75A; --accent-deep: #02893F;
    --accent-soft: #E4F7EC; --warn: #D9482B; --warn-soft: #FBEAE5;
    --console-bg: #10221A; --console-ink: #A8D8BC; --chip-name: #EEF2EF;
    --btn-ink: #FFFFFF;
    --chart-s1: #02893F; --chart-s2: #3B6FD4;
    --shadow: 0 1px 3px rgba(23,29,25,.08);
  }

  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--ground); color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    font-size: 15px; line-height: 1.55; padding: 1.25rem;
  }
  .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
  .app { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: .9rem; }

  header { display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap; }
  header h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -.01em; }
  header h1 em { font-style: normal; color: var(--accent-deep); }
  .ver { font-size: .72rem; font-weight: 700; letter-spacing: .06em; color: var(--accent-deep);
         border: 1px solid var(--accent); border-radius: 3px; padding: .05rem .4rem; }
  header .spacer { flex: 1; }
  .stat { display: inline-flex; align-items: center; gap: .4rem; font-size: .82rem; color: var(--sub); }
  .stat b { color: var(--ink); font-variant-numeric: tabular-nums; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }

  .settings { display: flex; align-items: center; gap: .55rem; padding: .65rem .9rem; flex-wrap: wrap; }
  .settings .label { font-size: .82rem; color: var(--sub); white-space: nowrap; }
  .settings input {
    padding: .38rem .55rem; border: 1px solid var(--line); border-radius: 5px;
    background: var(--ground); color: var(--ink); font: inherit;
  }
  .settings input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #cid, #csec { width: 11rem; }
  #checkHour { width: 4rem; }
  .keystate { font-size: .78rem; margin-left: auto; }
  .keystate.ok { color: var(--accent-deep); font-weight: 700; }
  .keystate.no { color: var(--warn); font-weight: 700; }

  button {
    font: inherit; font-weight: 600; cursor: pointer;
    border-radius: 6px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); padding: .45rem .9rem;
  }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--btn-ink); }
  button.primary:hover { filter: brightness(1.05); }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: transparent; }

  .toolbar { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }

  .main { display: grid; grid-template-columns: 1.15fr .85fr; gap: .9rem; align-items: start; }
  @media (max-width: 760px) { .main { grid-template-columns: 1fr; } }

  .panel-head {
    padding: .6rem .9rem; border-bottom: 1px solid var(--line);
    font-size: .78rem; font-weight: 700; letter-spacing: .07em; color: var(--sub);
  }
  .panel-body { padding: .5rem .6rem .7rem; }

  .product { border: 1px solid var(--line); border-radius: 7px; margin: .4rem .3rem; overflow: hidden; }
  .product-head { display: flex; align-items: center; gap: .55rem; padding: .55rem .75rem; background: var(--ground); flex-wrap: wrap; }
  .product-head .pname { font-weight: 700; }
  .product-head .mall { font-size: .8rem; color: var(--sub); }
  .product-head .del { margin-left: auto; font-size: .75rem; padding: .2rem .55rem; color: var(--warn); border-color: transparent; background: transparent; }
  .product-head .del:hover { border-color: var(--warn); }
  .badge-nvmid {
    font-size: .68rem; font-weight: 800; letter-spacing: .04em;
    background: var(--accent-soft); color: var(--accent-deep);
    border-radius: 999px; padding: .1rem .5rem;
  }
  .ch {
    font-size: .66rem; font-weight: 800; letter-spacing: .02em;
    border-radius: 4px; padding: .08rem .38rem;
  }
  .ch.naver { background: var(--accent-soft); color: var(--accent-deep); border: 1px solid var(--accent); }
  .ch.coupang { background: rgba(229,37,40,.1); color: #C81E21; border: 1px solid #E52528; }
  :root[data-theme="dark"] .ch.coupang { color: #FF8082; background: rgba(229,37,40,.18); }
  .linkbar { display: flex; gap: .45rem; }
  .linkbar input { flex: 1; min-width: 0; }
  .linkbar button { white-space: nowrap; }
  .hint { font-size: .76rem; color: var(--sub); margin-top: .3rem; }
  .hint.err { color: var(--warn); }
  .chips { display: flex; flex-wrap: wrap; gap: .35rem; }
  .chip-kw {
    font: inherit; font-size: .82rem; cursor: pointer; user-select: none;
    border: 1px solid var(--line); border-radius: 999px; padding: .25rem .7rem;
    background: var(--card); color: var(--sub);
  }
  .chip-kw:hover { border-color: var(--accent); }
  .chip-kw[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent); color: var(--btn-ink); font-weight: 600;
  }
  .chip-kw::before { content: "＋ "; }
  .chip-kw[aria-pressed="true"]::before { content: "✓ "; }
  .seg { display: flex; gap: 1rem; padding: .2rem 0; }
  .seg label { display: inline-flex; align-items: center; gap: .35rem; font-size: .9rem; color: var(--ink); font-weight: 500; cursor: pointer; }
  .seg input { accent-color: var(--accent); }
  .kwrow {
    display: flex; align-items: center; gap: .6rem; width: 100%;
    padding: .5rem .75rem; border: 0; border-top: 1px solid var(--line);
    background: var(--card); text-align: left; border-radius: 0; font-weight: 500;
  }
  .kwrow:hover { background: var(--accent-soft); border-color: var(--line); }
  .kwrow.selected { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .kwrow .kw { flex: 1; }
  .kwrow .rank { font-variant-numeric: tabular-nums; font-weight: 800; min-width: 3.6rem; text-align: right; }
  .kwrow .rank.none { color: var(--sub); font-weight: 500; font-size: .82rem; }
  .chip { font-size: .68rem; font-weight: 700; border-radius: 999px; padding: .12rem .5rem; letter-spacing: .03em; }
  .chip.nvmid { background: var(--accent); color: var(--btn-ink); }
  .chip.name { background: var(--chip-name); color: var(--ink); border: 1px solid var(--line); }
  .chip.not_found { background: transparent; color: var(--sub); border: 1px dashed var(--line); }
  .chip.wait { background: transparent; color: var(--sub); border: 1px solid transparent; }
  .empty { padding: 1.6rem 1rem; text-align: center; color: var(--sub); font-size: .86rem; }

  .history-title { padding: .55rem .9rem .1rem; font-size: .85rem; color: var(--sub); }
  .history-title b { color: var(--ink); }

  /* ── 추이 차트 ── */
  .chart-wrap { position: relative; padding: .3rem .9rem 0; }
  .chart-wrap svg { display: block; width: 100%; }
  .chart-legend { display: flex; gap: 1rem; padding: .15rem .9rem 0; font-size: .72rem; color: var(--sub); }
  .chart-legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: .3rem; vertical-align: -1px; }
  .chart-tip {
    position: absolute; pointer-events: none; display: none; z-index: 5;
    background: var(--card); border: 1px solid var(--line); border-radius: 6px;
    box-shadow: var(--shadow); padding: .35rem .55rem; font-size: .72rem; white-space: nowrap;
  }
  .chart-tip .d { color: var(--sub); }
  .chart-tip b { font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  th, td { padding: .45rem .9rem; text-align: left; border-top: 1px solid var(--line); }
  th { font-size: .72rem; letter-spacing: .06em; color: var(--sub); border-top: 0; }
  td.num { font-variant-numeric: tabular-nums; font-weight: 700; }
  .delta { font-size: .75rem; font-weight: 700; margin-left: .35rem; }
  .delta.up { color: var(--accent-deep); }
  .delta.down { color: var(--warn); }

  .console {
    background: var(--console-bg); color: var(--console-ink);
    border-radius: 8px; border: 1px solid var(--line);
    padding: .7rem .9rem; height: 168px; overflow-y: auto;
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: .78rem; line-height: 1.7; white-space: pre-wrap; word-break: break-all;
  }

  dialog {
    border: 1px solid var(--line); border-radius: 10px; padding: 0;
    background: var(--card); color: var(--ink);
    width: min(30rem, calc(100vw - 2rem));
    box-shadow: 0 16px 48px rgba(0,0,0,.25);
  }
  dialog::backdrop { background: rgba(10,20,14,.45); }
  .dlg-head { padding: .9rem 1.2rem; border-bottom: 1px solid var(--line); font-weight: 800; }
  .dlg-body { padding: 1rem 1.2rem; display: flex; flex-direction: column; gap: .75rem; }
  .field label { display: block; font-size: .78rem; font-weight: 600; color: var(--sub); margin-bottom: .25rem; }
  .field label .opt { font-weight: 400; }
  .field input, .field textarea, .field select {
    width: 100%; padding: .5rem .65rem; border: 1px solid var(--line); border-radius: 6px;
    background: var(--ground); color: var(--ink); font: inherit;
  }
  .field textarea { height: 4.4rem; resize: vertical; }
  .field input:focus, .field textarea:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  .dlg-foot { padding: .8rem 1.2rem; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: .6rem; }
  .form-err { color: var(--warn); font-size: .8rem; min-height: 1.1em; }

  @media (prefers-reduced-motion: no-preference) {
    .kwrow, button, .product { transition: background .12s, border-color .12s, filter .12s; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>상품 <em>순위추적기</em></h1>
    <span class="ver">네이버 · 쿠팡</span>
    <span class="spacer"></span>
    <span class="stat">오늘 API 사용량 <b id="usage" class="mono">0</b><span>/ 24,000</span></span>
  </header>

  <div class="card">
    <div class="settings">
      <span class="label">Client ID</span><input id="cid" autocomplete="off">
      <span class="label">Client Secret</span><input id="csec" type="password" autocomplete="off">
      <span class="label">자동 조회</span><input id="checkHour" type="number" min="0" max="23" value="9"><span class="label">시 00분</span>
      <span class="keystate" id="keyState"></span>
    </div>
    <div class="settings" style="border-top:1px solid var(--line)">
      <label class="label" style="display:inline-flex;align-items:center;gap:.35rem;cursor:pointer">
        <input type="checkbox" id="verifyReal" style="accent-color:var(--accent)"> 실측 검증 (네이버 · 브라우저 필요)
      </label>
      <span class="label">텔레그램 Token</span><input id="tgToken" style="width:10rem" autocomplete="off">
      <span class="label">Chat ID</span><input id="tgChat" style="width:6.5rem" autocomplete="off">
      <span class="label">급변 알림 기준</span><input id="alertTh" type="number" min="1" max="500" value="10" style="width:4rem"><span class="label">위 이상</span>
      <button id="saveSettings" class="ghost" style="margin-left:auto">설정 저장</button>
    </div>
  </div>

  <div class="toolbar">
    <button class="primary" id="openReg">+ 상품 등록</button>
    <button id="runCheck">지금 조회</button>
  </div>

  <div class="main">
    <section class="card">
      <div class="panel-head">상품 · 키워드 — 클릭하면 이력 표시</div>
      <div class="panel-body" id="productList"></div>
    </section>
    <section class="card">
      <div class="panel-head">순위 이력</div>
      <div class="history-title" id="historyTitle">키워드를 선택하세요</div>
      <div id="chartArea"></div>
      <div id="historyBody"><div class="empty">—</div></div>
    </section>
  </div>

  <div class="console" id="console" aria-live="polite"></div>
</div>

<dialog id="regDlg">
  <div class="dlg-head">상품 등록 — 링크만 붙여넣으면 나머지는 자동으로 채워집니다</div>
  <div class="dlg-body">
    <div class="field">
      <label for="fLink">상품 링크</label>
      <div class="linkbar">
        <input id="fLink" placeholder="쿠팡 또는 네이버 상품 페이지 주소를 붙여넣으세요">
        <button id="btnInspect" class="primary">불러오기</button>
      </div>
      <div class="hint" id="linkHint">링크를 넣고 불러오기를 누르면 상품명·채널·키워드 후보가 자동으로 채워집니다.</div>
    </div>

    <div class="field" id="kwField" hidden>
      <label>추적할 키워드 <span class="opt">— 클릭해서 켜고 끄세요</span></label>
      <div class="chips" id="kwChips"></div>
    </div>

    <details id="manualBox">
      <summary style="cursor:pointer; font-size:.82rem; color:var(--sub)">직접 입력 / 수정하기</summary>
      <div style="display:flex; flex-direction:column; gap:.7rem; padding-top:.7rem">
        <div class="field">
          <label>채널</label>
          <div class="seg">
            <label><input type="radio" name="fCh" value="naver" checked> 네이버쇼핑</label>
            <label><input type="radio" name="fCh" value="coupang"> 쿠팡</label>
          </div>
        </div>
        <div class="field"><label for="fName">상품명 *</label><input id="fName"></div>
        <div class="field"><label for="fMall">몰명 <span class="opt">(선택 — 동명 타셀러 구분)</span></label><input id="fMall"></div>
        <div class="field">
          <label for="fLimit">추적 범위</label>
          <select id="fLimit">
            <option value="100">100위까지</option>
            <option value="200">200위까지</option>
            <option value="300">300위까지</option>
            <option value="400" selected>400위까지</option>
            <option value="1000">1000위까지</option>
          </select>
        </div>
        <div class="field">
          <label for="fKw">키워드 추가 <span class="opt">(줄바꿈 또는 쉼표로 구분)</span></label>
          <textarea id="fKw" placeholder="위 후보에 없는 키워드를 직접 넣을 수 있습니다"></textarea>
        </div>
      </div>
    </details>

    <div class="form-err" id="formErr"></div>
  </div>
  <div class="dlg-foot">
    <button id="regCancel" class="ghost">취소</button>
    <button id="regSave" class="primary">등록</button>
  </div>
</dialog>

<script>
"use strict";
const $ = id => document.getElementById(id);
let selectedKw = null;      // {id, keyword, productName}
let logCursor = 0;
let pollTimer = null;

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) {
    let msg = r.statusText;
    try { msg = (await r.json()).detail || msg; } catch (e) {}
    throw new Error(msg);
  }
  return r.json();
}

/* ── 로그 ── */
async function pullLogs() {
  try {
    const { next, lines } = await api(`/api/logs?since=${logCursor}`);
    logCursor = next;
    if (lines.length) {
      for (const l of lines) {
        const div = document.createElement("div");
        div.textContent = l;
        $("console").appendChild(div);
      }
      $("console").scrollTop = $("console").scrollHeight;
    }
  } catch (e) { /* 서버 재시작 등 — 다음 폴링에서 회복 */ }
}

/* ── 상태 렌더링 ── */
const CHIP_LABEL = { nvmid: "nvmid 정밀", id: "ID 정밀", name: "이름 매칭", not_found: "미발견" };

async function refresh() {
  const s = await api("/api/state");
  $("usage").textContent = s.usage.toLocaleString();
  $("checkHour").value = s.check_hour;
  $("verifyReal").checked = s.verify_real;
  $("alertTh").value = s.alert_threshold;
  const ks = $("keyState");
  const naverOk = s.has_keys ? "네이버 키 ✓" : "네이버 키 미설정";
  ks.textContent = naverOk + (s.has_telegram ? " · 텔레그램 ✓" : "");
  ks.className = "keystate " + (s.has_keys ? "ok" : "no");
  $("runCheck").disabled = s.checking;
  $("runCheck").textContent = s.checking ? "조회 중…" : "지금 조회";

  const list = $("productList");
  list.textContent = "";
  if (!s.products.length) {
    const e = document.createElement("div"); e.className = "empty";
    e.innerHTML = "등록된 상품이 없습니다.<br>“+ 상품 등록”으로 시작하세요.";
    list.appendChild(e);
  }
  for (const p of s.products) {
    const card = document.createElement("div"); card.className = "product";
    const head = document.createElement("div"); head.className = "product-head";
    const ch = document.createElement("span"); ch.className = "ch " + p.channel;
    ch.textContent = p.channel === "coupang" ? "쿠팡" : "네이버";
    head.appendChild(ch);
    const nm = document.createElement("span"); nm.className = "pname"; nm.textContent = p.name;
    head.appendChild(nm);
    if (p.mall) { const m = document.createElement("span"); m.className = "mall"; m.textContent = p.mall; head.appendChild(m); }
    if (p.matched) { const b = document.createElement("span"); b.className = "badge-nvmid";
      b.textContent = p.channel === "coupang" ? "ID 확보" : "nvmid 확보"; head.appendChild(b); }
    const del = document.createElement("button"); del.className = "del"; del.textContent = "삭제";
    del.onclick = async () => {
      if (!confirm(`"${p.name}" 상품과 이력을 모두 삭제할까요?`)) return;
      await api(`/api/products/${p.id}`, { method: "DELETE" });
      if (selectedKw && selectedKw.productId === p.id) selectedKw = null;
      refresh(); renderHistory();
    };
    head.appendChild(del);
    card.appendChild(head);

    for (const k of p.keywords) {
      const row = document.createElement("button"); row.className = "kwrow";
      if (selectedKw && selectedKw.id === k.id) row.classList.add("selected");
      const kw = document.createElement("span"); kw.className = "kw"; kw.textContent = k.keyword; row.appendChild(kw);

      const chip = document.createElement("span");
      if (!k.latest) { chip.className = "chip wait"; chip.textContent = "미조회"; }
      else { chip.className = "chip " + k.latest.method; chip.textContent = CHIP_LABEL[k.latest.method]; }
      row.appendChild(chip);

      const rk = document.createElement("span");
      if (k.latest && k.latest.rank) { rk.className = "rank"; rk.textContent = k.latest.rank + "위"; }
      else if (k.latest) { rk.className = "rank none"; rk.textContent = "범위 밖"; }
      else { rk.className = "rank none"; rk.textContent = "—"; }
      row.appendChild(rk);

      row.onclick = () => { selectedKw = { id: k.id, keyword: k.keyword, productName: p.name, productId: p.id }; refresh(); renderHistory(); };
      card.appendChild(row);
    }
    list.appendChild(card);
  }
  return s;
}

/* ── 순위 추이 차트 (인라인 SVG, 순위축 반전: 1위가 위) ── */
const SVGNS = "http://www.w3.org/2000/svg";
function el(tag, attrs) {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}
function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function renderChart(rowsDesc) {
  const area = $("chartArea");
  area.textContent = "";
  const rows = [...rowsDesc].reverse(); // 날짜 오름차순
  const withRank = rows.filter(r => r.rank != null || r.real_rank != null);
  if (rows.length < 2 || withRank.length < 2) return; // 점 하나로는 추이가 아님

  const hasReal = rows.some(r => r.real_rank != null);
  const s1 = cssVar("--chart-s1"), s2 = cssVar("--chart-s2");
  const inkSub = cssVar("--sub"), line = cssVar("--line"), card = cssVar("--card");

  const wrap = document.createElement("div"); wrap.className = "chart-wrap";
  const W = Math.max(280, (area.clientWidth || area.parentElement.clientWidth || 480) - 30);
  const H = 150, L = 38, R = 12, T = 12, B = 22;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: "img",
                          "aria-label": "순위 추이 차트" });

  const ranks = [];
  rows.forEach(r => { if (r.rank != null) ranks.push(r.rank); if (r.real_rank != null) ranks.push(r.real_rank); });
  let lo = Math.min(...ranks), hi = Math.max(...ranks);
  if (lo === hi) { lo -= 1; hi += 1; }
  const pad = Math.max(1, Math.round((hi - lo) * 0.12));
  lo = Math.max(1, lo - pad); hi = hi + pad;

  const x = i => rows.length === 1 ? L : L + (W - L - R) * i / (rows.length - 1);
  const y = rank => T + (H - T - B) * (rank - lo) / (hi - lo); // 반전: 작은 순위(좋음)가 위

  // 그리드(가로 3줄) + 축 레이블 — 눈에 안 띄게
  for (let g = 0; g < 3; g++) {
    const rv = Math.round(lo + (hi - lo) * g / 2);
    const gy = y(rv);
    svg.appendChild(el("line", { x1: L, x2: W - R, y1: gy, y2: gy, stroke: line, "stroke-width": 1 }));
    const t = el("text", { x: L - 5, y: gy + 3.5, "text-anchor": "end", "font-size": 10, fill: inkSub });
    t.textContent = rv + "위"; svg.appendChild(t);
  }
  // X 레이블: 처음/끝 (MM-DD)
  [[0, "start"], [rows.length - 1, "end"]].forEach(([i, anchor]) => {
    const t = el("text", { x: x(i), y: H - 6, "text-anchor": anchor, "font-size": 10, fill: inkSub });
    t.textContent = rows[i].date.slice(5); svg.appendChild(t);
  });

  // 선 그리기 — 미발견(null)은 선을 끊는다
  function drawSeries(key, color) {
    let d = "", pen = false;
    rows.forEach((r, i) => {
      if (r[key] == null) { pen = false; return; }
      d += (pen ? "L" : "M") + x(i).toFixed(1) + " " + y(r[key]).toFixed(1) + " ";
      pen = true;
    });
    if (d) svg.appendChild(el("path", { d, fill: "none", stroke: color, "stroke-width": 2,
                                        "stroke-linejoin": "round", "stroke-linecap": "round" }));
    rows.forEach((r, i) => {
      if (r[key] == null) return;
      svg.appendChild(el("circle", { cx: x(i), cy: y(r[key]), r: 3.5, fill: color,
                                     stroke: card, "stroke-width": 2 }));
    });
  }
  drawSeries("rank", s1);
  if (hasReal) drawSeries("real_rank", s2);

  // 호버: 세로 크로스헤어 + 툴팁
  const cross = el("line", { y1: T, y2: H - B, stroke: inkSub, "stroke-width": 1,
                             "stroke-dasharray": "3 3", visibility: "hidden" });
  svg.appendChild(cross);
  const tip = document.createElement("div"); tip.className = "chart-tip";
  const overlay = el("rect", { x: L, y: T, width: W - L - R, height: H - T - B, fill: "transparent" });
  overlay.addEventListener("mousemove", ev => {
    const box = svg.getBoundingClientRect();
    const px = (ev.clientX - box.left) * (W / box.width);
    const i = Math.max(0, Math.min(rows.length - 1, Math.round((px - L) / ((W - L - R) / (rows.length - 1)))));
    const r = rows[i];
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i));
    cross.setAttribute("visibility", "visible");
    tip.innerHTML = "";
    const d = document.createElement("span"); d.className = "d"; d.textContent = r.date;
    tip.appendChild(d); tip.appendChild(document.createElement("br"));
    tip.appendChild(document.createTextNode("순위 "));
    const b1 = document.createElement("b"); b1.textContent = r.rank != null ? r.rank + "위" : "미발견";
    tip.appendChild(b1);
    if (hasReal) {
      tip.appendChild(document.createTextNode(" · 실측 "));
      const b2 = document.createElement("b"); b2.textContent = r.real_rank != null ? r.real_rank + "위" : "—";
      tip.appendChild(b2);
    }
    tip.style.display = "block";
    const tipX = Math.min(x(i) / W * box.width + 10, box.width - 130);
    tip.style.left = tipX + "px"; tip.style.top = "6px";
  });
  overlay.addEventListener("mouseleave", () => {
    cross.setAttribute("visibility", "hidden"); tip.style.display = "none";
  });
  svg.appendChild(overlay);

  wrap.appendChild(svg); wrap.appendChild(tip);
  area.appendChild(wrap);

  if (hasReal) { // 2계열일 때만 범례
    const lg = document.createElement("div"); lg.className = "chart-legend";
    [["API 순위", s1], ["실측 순위", s2]].forEach(([name, c]) => {
      const item = document.createElement("span");
      const sw = document.createElement("span"); sw.className = "sw"; sw.style.background = c;
      item.appendChild(sw); item.appendChild(document.createTextNode(name));
      lg.appendChild(item);
    });
    area.appendChild(lg);
  }
}

async function renderHistory() {
  const body = $("historyBody"), title = $("historyTitle");
  body.textContent = "";
  $("chartArea").textContent = "";
  if (!selectedKw) {
    title.textContent = "키워드를 선택하세요";
    const e = document.createElement("div"); e.className = "empty"; e.textContent = "—";
    body.appendChild(e); return;
  }
  title.innerHTML = "";
  title.append(Object.assign(document.createElement("b"), { textContent: selectedKw.keyword }),
               ` — ${selectedKw.productName}`);
  const rows = await api(`/api/history/${selectedKw.id}`);
  if (!rows.length) {
    const e = document.createElement("div"); e.className = "empty"; e.textContent = "아직 조회 이력이 없습니다";
    body.appendChild(e); return;
  }
  renderChart(rows);
  const hasReal = rows.some(h => h.real_rank != null);
  const tbl = document.createElement("table");
  tbl.innerHTML = "<thead><tr><th>날짜</th><th>순위</th>" + (hasReal ? "<th>실측</th>" : "") + "<th>매칭 방식</th></tr></thead>";
  const tb = document.createElement("tbody");
  rows.forEach((h, idx) => {
    const prev = idx + 1 < rows.length ? rows[idx + 1] : null;
    const tr = document.createElement("tr");
    const td1 = document.createElement("td"); td1.className = "mono"; td1.textContent = h.date;
    const td2 = document.createElement("td"); td2.className = "num";
    td2.textContent = h.rank ? h.rank + "위" : "미발견";
    if (h.rank && prev && prev.rank) {
      const diff = prev.rank - h.rank;
      if (diff !== 0) {
        const sp = document.createElement("span");
        sp.className = "delta " + (diff > 0 ? "up" : "down");
        sp.textContent = (diff > 0 ? "▲" : "▼") + Math.abs(diff);
        td2.appendChild(sp);
      }
    }
    tr.append(td1, td2);
    if (hasReal) {
      const tdr = document.createElement("td"); tdr.className = "num";
      tdr.textContent = h.real_rank != null ? h.real_rank + "위" : "—";
      tr.appendChild(tdr);
    }
    const td3 = document.createElement("td");
    const chip = document.createElement("span"); chip.className = "chip " + h.method;
    chip.textContent = CHIP_LABEL[h.method]; td3.appendChild(chip);
    tr.appendChild(td3); tb.appendChild(tr);
  });
  tbl.appendChild(tb); body.appendChild(tbl);
}

/* ── 조회 실행: 시작 후 끝날 때까지 빠른 폴링 ── */
async function runCheck() {
  try {
    const r = await api("/api/check", { method: "POST" });
    if (!r.started) return;
  } catch (e) { alert(e.message); return; }
  $("runCheck").disabled = true; $("runCheck").textContent = "조회 중…";
  const fast = setInterval(async () => {
    try {
      await pullLogs();
      const s = await refresh();
      if (!s.checking) { clearInterval(fast); renderHistory(); }
    } catch (e) { /* 일시적 서버 오류 — 다음 틱에서 재시도 */ }
  }, 1000);
}

/* ── 설정 저장 ── */
$("saveSettings").onclick = async () => {
  await api("/api/settings", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      client_id: $("cid").value, client_secret: $("csec").value,
      check_hour: parseInt($("checkHour").value, 10) || 9,
      verify_real: $("verifyReal").checked,
      alert_threshold: parseInt($("alertTh").value, 10) || 10,
      telegram_token: $("tgToken").value, telegram_chat_id: $("tgChat").value,
    }),
  });
  $("cid").value = ""; $("csec").value = ""; $("tgToken").value = ""; $("tgChat").value = "";
  await pullLogs(); refresh();
};

/* ── 등록 모달: 링크 → 자동 채움 → 키워드 클릭 ── */
let inspected = { nvmid: "" };

function currentChannel() {
  return document.querySelector('input[name="fCh"]:checked').value;
}

function renderChips(list) {
  const box = $("kwChips");
  box.textContent = "";
  for (const item of list) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip-kw";
    b.textContent = item.keyword;
    b.setAttribute("aria-pressed", item.recommended ? "true" : "false");
    b.onclick = () => b.setAttribute("aria-pressed",
      b.getAttribute("aria-pressed") === "true" ? "false" : "true");
    box.appendChild(b);
  }
  $("kwField").hidden = list.length === 0;
}

function selectedChips() {
  return [...document.querySelectorAll('#kwChips .chip-kw[aria-pressed="true"]')]
    .map(b => b.textContent.trim());
}

function resetForm() {
  ["fLink", "fName", "fMall", "fKw"].forEach(id => $(id).value = "");
  $("kwChips").textContent = ""; $("kwField").hidden = true;
  $("formErr").textContent = "";
  $("manualBox").open = false;
  inspected = { nvmid: "" };
  setHint("링크를 넣고 불러오기를 누르면 상품명·채널·키워드 후보가 자동으로 채워집니다.", false);
}

function setHint(text, isError) {
  const h = $("linkHint");
  h.textContent = text;
  h.className = "hint" + (isError ? " err" : "");
}

async function inspectLink() {
  const link = $("fLink").value.trim();
  if (!link) { setHint("상품 링크를 먼저 붙여넣어 주세요.", true); return; }
  const btn = $("btnInspect");
  btn.disabled = true; btn.textContent = "불러오는 중…";
  setHint("상품 페이지를 확인하고 있습니다…", false);
  try {
    const r = await api("/api/inspect", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ link }),
    });
    if (r.channel) {
      const radio = document.querySelector(`input[name="fCh"][value="${r.channel}"]`);
      if (radio) radio.checked = true;
    }
    if (r.name) $("fName").value = r.name;
    if (r.mall) $("fMall").value = r.mall;
    inspected.nvmid = r.nvmid || "";
    renderChips(r.keywords || []);

    if (r.ok) {
      const chName = r.channel === "coupang" ? "쿠팡" : "네이버";
      const idNote = (r.ext_ids || r.nvmid) ? " · 상품 ID 확보 → 첫 조회부터 정밀 매칭"
                                            : " · 상품 ID는 첫 조회 때 자동 확보";
      setHint(`${chName} 상품 인식 완료${idNote}. 추적할 키워드를 클릭해 고르세요.`, false);
    } else {
      $("manualBox").open = true;
      setHint((r.error || "상품 정보를 가져오지 못했습니다") + " — 아래에서 직접 입력해 주세요.", true);
    }
  } catch (e) {
    $("manualBox").open = true;
    setHint("불러오기 실패: " + e.message + " — 아래에서 직접 입력해 주세요.", true);
  } finally {
    btn.disabled = false; btn.textContent = "불러오기";
  }
}

$("btnInspect").onclick = inspectLink;
$("fLink").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); inspectLink(); } });

$("openReg").onclick = () => { resetForm(); $("regDlg").showModal(); $("fLink").focus(); };
$("regCancel").onclick = () => $("regDlg").close();

$("regSave").onclick = async () => {
  const name = $("fName").value.trim();
  const typed = $("fKw").value.replace(/,/g, "\n").split("\n").map(x => x.trim()).filter(Boolean);
  const kws = [...new Set([...selectedChips(), ...typed])];
  if (!name) {
    $("manualBox").open = true;
    $("formErr").textContent = "상품명이 비어 있습니다 — 링크를 불러오거나 직접 입력해 주세요";
    return;
  }
  if (!kws.length) {
    $("formErr").textContent = "추적할 키워드를 하나 이상 선택하거나 입력해 주세요";
    return;
  }
  try {
    await api("/api/products", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name, mall: $("fMall").value, link: $("fLink").value,
        track_limit: parseInt($("fLimit").value, 10), keywords: kws,
        channel: currentChannel(), nvmid: inspected.nvmid,
      }),
    });
  } catch (e) { $("formErr").textContent = e.message; return; }
  $("regDlg").close();
  await pullLogs(); refresh();
};

$("runCheck").onclick = runCheck;

/* ── 초기화 + 완만한 폴링 (스케줄 자동조회 반영용) ── */
refresh(); pullLogs();
pollTimer = setInterval(() => { pullLogs(); refresh(); }, 5000);
</script>
